<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrito de compra</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>

<body>        
<header class="contenedor">                 <!-- Encabezado -->
    <div class="encabezado">
        <div class="logo1" >        
            <img src="./img/miniLOGO1.jpg" alt="logo">
        </div>       
        <nav>
            <ul class="menu">
                <li><a href="./index.html">Volver a la tienda</a></li>
                <li>
                    <a href="#">Carrito</a>        <!-- href="carrito.html" -->
                    <i id="icono-carrito" class="fa-sharp fa-solid fa-cart-shopping"></i>
                    <span id="contador-carrito" class="contador">0</span>
                </li>
                <li>
                    <a href="#">Iniciar sesión</a>
                    <i class="fa-solid fa-circle-user"></i>
                </li>
            </ul>
        </nav>
    </div>
</header>

<main class="contenedor">                          <!-- Cuerpo principal -->

  <h2 class="titulo-seccion">Tu carrito</h2>

  <div class="bloque-checkout">

    <!-- Columna 1: lo que hay en el carrito (lo llena js/finalizar.js) -->
    <section class="resumen-carrito">
      <h3>Artículos</h3>
      <div id="lista-carrito"></div>

      <p class="total">Total: <span id="total-carrito">$0</span></p>
      <button class="boton-secundario" onclick="vaciarCarrito(); mostrarCarrito();">
        <i class="fa-solid fa-trash"></i> Vaciar carrito
      </button>
    </section>

    <!-- Columna 2: datos del comprador -->
    <section class="formulario-compra">
      <h3>Datos para facturación</h3>

      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" placeholder="Ej: Ana Pérez">

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="ana@mail.com">

      <button class="boton" onclick="finalizarCompra()">
        <i class="fa-solid fa-check"></i> Finalizar compra
      </button>
    </section>

  </div>
</main>

<footer>                        <!-- Pie -->
  <p class="pie">&copy; Bien al Sur </p>
</footer>

<!-- SweetAlert2: libreria para mostrar alertas lindas -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.12.4/dist/sweetalert2.all.min.js"></script>

<!-- El orden importa: primero los datos, despues las funciones -->
<script src="./js/productos.js"></script>
<script src="./js/carrito.js"></script>
<script src="./js/finalizar.js"></script>

</body>
</html>
